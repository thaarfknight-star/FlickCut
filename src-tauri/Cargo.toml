[workspace]
members = [".", "crates/flickcut-input", "crates/flickcut-moments", "crates/flickcut-engine", "crates/flickcut-render", "crates/flickcut-capture"]
resolver = "2"

[package]
name = "flickcut"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flickcut-input = { path = "crates/flickcut-input" }
flickcut-moments = { path = "crates/flickcut-moments" }
flickcut-render = { path = "crates/flickcut-render" }
flickcut-capture = { path = "crates/flickcut-capture" }

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

# libspa 0.8.0 does not compile against PipeWire < 0.3.6x headers
# (Ubuntu 22.04 ships 0.3.48): VideoInfoRaw::new() names struct fields
# that don't exist there. Vendored copy with a field-by-field construction
# fix; see crates/vendor/libspa/FLICKCUT_PATCH.md.
[patch.crates-io]
libspa = { path = "crates/vendor/libspa" }


