[package]
name = "flickcut-moments"
version = "0.1.0"
edition = "2021"
description = "FlickCut moment detection engine: burst detection over input events (kill/hit/exciting)"
license = "MIT OR Apache-2.0"

[lib]
name = "flickcut_moments"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flickcut-input = { path = "../flickcut-input" }
