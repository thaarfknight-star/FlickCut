[package]
name = "flickcut-capture"
version = "0.1.0"
edition = "2021"
description = "FlickCut Tauri v2 capture module: native per-platform screen capture, session clock, ffmpeg encoding"
license = "MIT OR Apache-2.0"

[lib]
name = "flickcut_capture"
path = "src/lib.rs"

[[bin]]
name = "flickcut-harness"
path = "src/bin/harness.rs"

[dependencies]
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.10"
pipewire = "0.8"
tokio = { version = "1", features = ["rt", "time", "net"] }
