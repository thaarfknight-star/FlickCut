# FlickCut — first real builds (Tauri v2).
#
# Builds installable artifacts on all three desktop OSes. Runs on every push
# to main and on demand. Per Taha's order (2026-10-18): ship the pipeline
# GREEN today with the current main (recording stubs) — do not wait for the
# capture module; the second build comes after TAgent's capture merges.
#
# Signing is skipped for these test builds: the updater artifacts step is
# disabled via a CI config override (the real `createUpdaterArtifacts: true`
# stays in tauri.conf.json for release builds). macOS/Windows builds are
# unsigned until the pre-release signing ceremony.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: recommended baseline for maximum glibc compat.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-spike/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri v2 baseline + xcap (screen/window enumeration) system deps.
          # Package list per TAgent's capture report.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libclang-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libdrm-dev \
            libegl-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libxrandr-dev \
            libdbus-1-dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend-spike

      # Test builds skip updater artifact signing (no key yet). The override
      # deep-merges over tauri.conf.json; release builds keep artifacts on.
      - name: Write CI config override
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/ci-override.json

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.target }} --config ci-override.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: flickcut-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn

      - name: Report bundle sizes
        shell: bash
        run: |
          echo "### Bundle sizes (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target/${{ matrix.target }}/release/bundle \
            -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \
              -o -name '*.dmg' -o -name '*.msi' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec ls -lh {} \; 2>/dev/null \
            | awk '{print "- " $9 " (" $5 ")"}' >> "$GITHUB_STEP_SUMMARY" || true
