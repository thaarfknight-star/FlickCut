# FlickCut — first real builds (Tauri v2).
#
# Builds installable artifacts on all three desktop OSes. Runs on every push
# to main and on demand. Per Taha's order (2026-10-18): ship the pipeline
# GREEN today with the current main (recording stubs) — do not wait for the
# capture module; the second build comes after TAgent's capture merges.
#
# Signing is skipped for these test builds: the updater artifacts step is
# disabled via a CI config override (the real `createUpdaterArtifacts: true`
# stays in tauri.conf.json for release builds). macOS/Windows builds are
# unsigned until the pre-release signing ceremony.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: recommended baseline for maximum glibc compat.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cleanup old caches
        # Keep only the most recent cache per key prefix; delete the rest
        # to stay within GitHub's cache quota. Runs on every build.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # List all caches, keep newest per key prefix, delete the rest
          gh api "/repos/${{ github.repository }}/actions/caches?per_page=100" --paginate             | jq -r '.actions_caches | sort_by(.created_at) | reverse | .[] | "\(.id) \(.key)"'             | awk '{key=$2; sub(/-[0-9a-f]+$/, "", key); if (seen[key]++) print $1}'             | while read -r cache_id; do
              echo "Deleting old cache $cache_id"
              gh api -X DELETE "/repos/${{ github.repository }}/actions/caches/$cache_id" || true
            done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-spike/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri v2 baseline + xcap (screen/window enumeration) system deps.
          # Package list per TAgent's capture report.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libclang-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libdrm-dev \
            libegl-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            libxrandr-dev \
            libdbus-1-dev libudev-dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend-spike

      # Test builds skip updater artifact signing (no key yet). The override
      # deep-merges over tauri.conf.json; release builds keep artifacts on.
      - name: Write CI config override
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/ci-override.json

      # Bundles a static ffmpeg as a Tauri v2 sidecar so render_video works
      # on the user's machine. Tauri auto-bundles anything in
      # src-tauri/binaries/ named <name>-<triple>[.exe]; resolve_ffmpeg()
      # in main.rs finds it next to the app binary.
      #
      # Third-party attribution (all GPL builds with libx264, AGPL-3.0
      # compatible — see the spike report):
      # - Windows: BtbN FFmpeg-Builds (https://github.com/BtbN/FFmpeg-Builds)
      # - Linux:   johnvansickle static builds (https://johnvansickle.com/ffmpeg/)
      # - macOS:   OSXExperts static builds (https://www.osxexperts.net/)
      #
      # Versions are PINNED (per TAgent5): review quarterly. Bump the
      # cache key when changing versions.
      - name: Cache ffmpeg sidecar
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries/
          key: ffmpeg-v1-${{ matrix.target }}
          # v1 = BtbN ffmpeg 8.1 / johnvansickle release / osxexperts ffmpeg9arm

      - name: Download ffmpeg sidecar
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          TARGET="${{ matrix.target }}"
          case "${{ runner.os }}" in
            Windows)
              # BtbN ffmpeg 8.1 stable branch, GPL with libx264.
              # Pinned to 8.1 (not rolling master) for reproducibility.
              curl -sSfL -o /tmp/ffmpeg.zip \
                "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip"
              7z x /tmp/ffmpeg.zip -o/tmp/ff -y
              cp /tmp/ff/ffmpeg-*/bin/ffmpeg.exe \
                 "src-tauri/binaries/ffmpeg-${TARGET}.exe"
              ;;
            Linux)
              # johnvansickle release build, GPL with libx264.
              curl -sSfL -o /tmp/ffmpeg.tar.xz \
                "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
              tar -xf /tmp/ffmpeg.tar.xz -C /tmp
              cp /tmp/ffmpeg-*-amd64-static/ffmpeg \
                 "src-tauri/binaries/ffmpeg-${TARGET}"
              chmod +x "src-tauri/binaries/ffmpeg-${TARGET}"
              ;;
            macOS)
              # OSXExperts native ARM64 static build, GPL with libx264.
              curl -sSfL -o /tmp/ffmpeg.zip "https://www.osxexperts.net/ffmpeg9arm.zip"
              unzip -o -q /tmp/ffmpeg.zip -d /tmp/ff
              FFMAC="$(find /tmp/ff -name ffmpeg -type f | head -1)"
              cp "$FFMAC" "src-tauri/binaries/ffmpeg-${TARGET}"
              chmod +x "src-tauri/binaries/ffmpeg-${TARGET}"
              ;;
          esac
          echo "--- sidecar binaries ---"
          ls -lh src-tauri/binaries/
          # Smoke-test: the binary runs and has the libx264 encoder.
          BIN="$(ls src-tauri/binaries/ffmpeg-* | head -1)"
          "$BIN" -hide_banner -h encoder=libx264 2>&1 | head -3

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --target ${{ matrix.target }} --config ci-override.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: flickcut-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn

      - name: Report bundle sizes
        shell: bash
        run: |
          echo "### Bundle sizes (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target/${{ matrix.target }}/release/bundle \
            -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' \
              -o -name '*.dmg' -o -name '*.msi' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec ls -lh {} \; 2>/dev/null \
            | awk '{print "- " $9 " (" $5 ")"}' >> "$GITHUB_STEP_SUMMARY" || true
